name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # so tagged builds can publish a Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # No single-file COMPRESSION (the self-extracting compressed stub is a common
      # antivirus false-positive trigger); ReadyToRun precompiles the IL so the exe
      # looks less like a packed blob.
      - name: Publish self-contained single-file exe
        run: >
          dotnet publish Purrch/Purrch.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish

      # --- Code signing (SignPath, free for open source) ---------------------
      # Fully wired but dormant: it only runs once you set the repo variable
      # SIGNPATH_ORG_ID and secret SIGNPATH_API_TOKEN (see SIGNING.md). Until then
      # the build ships the same unsigned exe as before. SignPath pulls the
      # uploaded artifact, signs it in the cloud, and writes the signed copy back
      # into publish/, so everything downstream uses the signed exe automatically.
      - id: unsigned
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: purrch-unsigned
          path: publish/Purrch.exe

      - name: Code-sign with SignPath
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: purrch-win
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          output-artifact-directory: publish
      # -----------------------------------------------------------------------

      - name: Checksum
        shell: pwsh
        run: '(Get-FileHash "publish\Purrch.exe" -Algorithm SHA256).Hash + "  Purrch.exe" | Out-File -Encoding ascii "publish\Purrch.exe.sha256.txt"'

      - uses: actions/upload-artifact@v4
        with:
          name: purrch-windows
          path: |
            publish/Purrch.exe
            publish/Purrch.exe.sha256.txt

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Purrch.exe
            publish/Purrch.exe.sha256.txt
