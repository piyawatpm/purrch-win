name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # so tagged builds can publish a Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # No single-file COMPRESSION (the self-extracting compressed stub is a common
      # antivirus false-positive trigger); ReadyToRun precompiles the IL so the exe
      # looks less like a packed blob.
      - name: Publish self-contained single-file exe
        run: >
          dotnet publish Purrch/Purrch.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish

      # Real code signing is the only thing that fully clears SmartScreen. This runs
      # automatically once you add CODE_SIGN_PFX_BASE64 + CODE_SIGN_PASSWORD repo
      # secrets; until then it just skips.
      - name: Code-sign (if a certificate is configured)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PW: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64)) { Write-Host "No signing certificate configured - skipping."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "publish\Purrch.exe"

      - name: Checksum
        shell: pwsh
        run: '(Get-FileHash "publish\Purrch.exe" -Algorithm SHA256).Hash + "  Purrch.exe" | Out-File -Encoding ascii "publish\Purrch.exe.sha256.txt"'

      - uses: actions/upload-artifact@v4
        with:
          name: purrch-windows
          path: |
            publish/Purrch.exe
            publish/Purrch.exe.sha256.txt

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Purrch.exe
            publish/Purrch.exe.sha256.txt
